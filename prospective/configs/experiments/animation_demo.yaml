experiment:
  name: animation_demo
  seed: 11
  output_root: runs

geometry:
  length: 100.0
  n_input: 24
  n_competitive: 24
  boundary_mode: paper_reset

tutor:
  speed: 20.0
  sigma: 5.0
  integrated_drive: 30.0
  initial_position: 0.0

neural:
  dt: 0.005
  tau_u: 0.015
  tau_v: 0.6
  adaptation_strength: 0.2
  inhibition_strength: 1.05

feedforward_learning:
  enabled: true
  eta: 0.05
  alpha: 1.0
  beta: 0.5
  initial_weight_scale: 0.25
  nonnegative_clip: true

simulation:
  duration: 300.0
  state_sample_interval_steps: 10
  weight_snapshot_interval_steps: 500
  divergence_threshold: 1000000.0
  progress: true

analysis:
  transient_duration: 10.0
  boundary_margin_sigmas: 2.5
  bump_strength_min: 0.05
  fit_gaussian_for_diagnostics: true

animation:
  enabled: true
  fps: 24
  render_progress: true
  display_top_k_connections: 40
  update_highlight_mode: top_k_absolute_delta
  render_matrix_inset: true
  neural_window_seconds: 20.0
  learning_frame_interval_cycles: 1
  learning_hold_seconds: 0.5
  global_frame_count: 720
  output_format: mp4
