      - -2.8559933214452666
      - -2.284794657156213
      - -1.7135959928671598
      - -1.1423973285781066
      - -0.5711986642890533
    maximum_rms_velocity_bias: 0.02
    maximum_abs_velocity_bias: 0.035
    maximum_abs_zero_velocity_drift: 0.002
    maximum_depinning_velocity: 0.08726646259971647
    minimum_pva_strength: 0.8
    minimum_bump_contrast: 0.1

