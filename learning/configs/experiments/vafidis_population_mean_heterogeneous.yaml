# Pure population-mean HD/HR experiment from the scaling proposal.
#
# This is a new model family, not a rescaled legacy run. Dense plastic
# pathways use 1 / N_pre, while fixed one-to-one HD->HR connections and
# per-neuron external currents remain O(1). To run the finite-size pilot,
# change n_theta and n_hr together among 60, 120, 240, and 480; all other
# intensive parameters and physical durations stay fixed.

experiment_name: vafidis_population_mean_heterogeneous

model:
  # n_theta is the current code's HD-cell count (not the unique heading-bin
  # count). The paired geometry therefore has 60 headings at n_theta=120.
  n_theta: 360
  n_hr: 360
  hd_distal_normalization: presynaptic_population_mean
  tau_s: 0.065
  tau_hd_to_hr: 0.04
  tau_l_hd: 0.01
  p_distal_to_proximal: 0.6666666667
  b_hd: 0.6
  b_hr: 1.5
  # Sparse one-to-one fan-in: deliberately not divided by population size.
  w_hd_to_hr_strength: 2.0
  activation:
    name: sigmoid
    gain: 2.5
    bias: 1.0
  init:
    # Learn the intensive kernels from scratch. Scale fields are inactive in
    # zero mode but remain O(1) if a frozen local-kernel control is selected.
    w_hd_to_hd_mode: zeros
    w_hr_to_hd_mode: zeros
    w_hd_to_hd_scale: 1.0
    w_hr_to_hd_scale: 1.0
    local_sigma: 0.45
    random_jitter: 0.0

simulation:
  seed: 42
  dt: 0.01
  # Hard upper bound. The convergence rule below may stop online learning
  # earlier, but never before the N-independent 8000 s clean-control horizon.
  train_duration: 24000.0
  plasticity_enabled: true
  # Separating initialization and velocity RNG streams makes the scalar OU
  # trajectory identical when neuron count changes.
  random_stream_mode: component_split
  initialization_seed_offset: 0
  velocity_seed_offset: 10000
  bump_test_duration: 10.0
  darkness_test_duration: 10.0
  cue_duration: 1.0
  pi_cue_duration: 4.0
  recue_duration: 8.0
  # At N=360, retaining the old 10 s full-matrix cadence for a 24000 s run
  # would accumulate almost 5 GB of uncompressed weight snapshots in memory.
  save_interval_steps: 50
  weight_snapshot_interval_steps: 50000
  theta0: 0.0
  progress: true
  early_stopping:
    enabled: true
    min_duration: 8000.0
    check_interval: 500.0
    window_duration: 1000.0
    patience_checks: 3
    relative_weight_change_tolerance: 0.02
    relative_error_change_tolerance: 0.05

learning_rule:
  # These are intensive pilot parameters: the same values must be used at
  # every N and are not obtained by multiplying legacy values by a reference N.
  # Keep the Vafidis local error/PSP update itself N-independent.  The wider
  # bounds below make the online kernels comparable to the successful frozen
  # population-mean controls instead of clipping them at the legacy raw-sum
  # scale.  Structural modes remain unconstrained: HD symmetry and opposing
  # LHR/RHR projections must emerge from online local learning rather than be
  # imposed by the experiment configuration.
  eta_hd_to_hd: 3.0
  eta_hr_to_hd: 20.0
  tau_delta: 0.10
  w_hd_to_hd_min: -30.0
  w_hd_to_hd_max: 70.0
  w_hr_to_hd_min: -80.0
  w_hr_to_hd_max: 80.0
  hd_to_hd_symmetry_mode: none
  hd_to_hd_balance_mode: none
  hr_to_hd_balance_mode: none

visual:
  # Phase 1 retains the existing Clark-style visual-current definition.
  profile: heterogeneous_gaussian_process
  amplitude: 0.484419041134548
  kappa: 11.11111111111111
  baseline: 5.0
  normalize_peak: true
  light_excitation: 4.0
  proximal_scale: 0.3333333333
  noise_std: 0.0
  noise_process: ou_additive
  noise_correlation_time: 0.065
  apply_noise_during_training: true
  apply_noise_during_visual_test: true
  noise_seed_offset: 20000
  heterogeneous_sigma: 1.4
  heterogeneous_beta: 2.6057585657926885
  heterogeneous_bias: 2.0814271322479385
  # The angular sampling grid is independent of the HD population size.
  heterogeneous_n_angles: 512
  heterogeneous_seed_offset: 40000
  heterogeneous_alignment: center_of_mass
  heterogeneous_normalization: unit_angular_mean
  # A 720-cell master bank is divisible by the current 120/240/360-cell
  # scaling ladder. Coarser paired-HD grids therefore select angularly nested
  # subsets instead of drawing a different simulated mouse at each N.
  heterogeneous_population_sampling: nested_master
  heterogeneous_master_n_hd_cells: 720
  heterogeneous_plot_sample_count: 16
  heterogeneous_plot_seed_offset: 50000

velocity:
  process: ou
  mean: 0.0
  std: 3.9269908169872414
  tau: 0.50
  clip: 12.566370614359172
  k_vel: 0.15915494309189535

tests:
  darkness_angular_velocity: 1.3089969389957472
  hd_tuning_curve_angles: 360
  hd_tuning_curve_settle_duration: 4.0
  hd_tuning_curve_max_settle_duration: 6.0
  hd_tuning_curve_convergence_window: 0.2
  hd_tuning_curve_convergence_tolerance: 0.002
  hd_tuning_curve_sample_count: 8
  ou_pi_ensemble_trials: 24
  ou_pi_ensemble_seed_offset: 60000
  ou_pi_ensemble_fit_start_time: 0.5
  bump_diffusion_duration: 10.0
  bump_diffusion_trials: 120
  bump_diffusion_test_noise_std: 0.1
  bump_diffusion_seed_offset: 30000
  bump_diffusion_fit_start_time: 1.0
  bump_diffusion_fit_end_time: null
  # Frozen-weight attractor-landscape screening protocol. Uniform cue starts
  # are released into zero-velocity darkness and decoded by PVA, peak neuron,
  # and Clark Eq. 6 overlap. Use 360 starts / 60 s for a formal dense map.
  bump_attractor_trajectory_enabled: true
  bump_attractor_initial_conditions: 36
  bump_attractor_duration: 30.0
  bump_attractor_cue_duration: 4.0
  bump_attractor_sample_interval: 0.25
  gain_velocities:
    - -8.726646259971648
    - -6.981317007977318
    - -5.235987755982989
    - -3.490658503988659
    - -1.7453292519943295
    - 0.0
    - 1.7453292519943295
    - 3.490658503988659
    - 5.235987755982989
    - 6.981317007977318
    - 8.726646259971648

paths:
  runs_root: runs/vafidis_population_mean_heterogeneous
  reports_root: reports
