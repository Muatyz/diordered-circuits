# Clean-cue functional control for the pure population-mean HD/HR model.
#
# Dense plastic pathways use 1 / N_pre.  The learned matrices are intensive
# kernels, so the Vafidis error/PSP update, learning rates, bounds, and physical
# training duration do not depend on a reference population size.  No HD or HR
# weight symmetry is imposed: the clean rotating cue must let those structures
# emerge through online local learning.

experiment_name: vafidis_population_mean_von_mises

model:
  # The paired Vafidis geometry has 60 unique headings at n_theta=120.
  n_theta: 360
  n_hr: 360
  hd_distal_normalization: presynaptic_population_mean
  tau_s: 0.065
  tau_hd_to_hr: 0.04
  tau_l_hd: 0.01
  p_distal_to_proximal: 0.6666666667
  c_hd_proximal: 0.001
  g_l_hd_proximal: 1.0
  g_d_hd_to_proximal: 2.0
  b_hd: 0.6
  b_hr: 1.5
  # This sparse one-to-one pathway has fixed fan-in and is not divided by N.
  w_hd_to_hr_strength: 13.333333333333334
  activation:
    name: sigmoid
    gain: 2.5
    bias: 1.0
    max_rate: 0.15
  init:
    # Learn both intensive kernels from zero rather than seeding a target form.
    w_hd_to_hd_mode: zeros
    w_hr_to_hd_mode: zeros
    w_hd_to_hd_scale: 6.666666666666667
    w_hr_to_hd_scale: 6.666666666666667
    local_sigma: 0.45
    random_jitter: 0.0

simulation:
  seed: 42
  dt: 0.0005
  train_duration: 20000.0
  plasticity_enabled: true
  random_stream_mode: component_split
  initialization_seed_offset: 0
  velocity_seed_offset: 10000
  save_interval_steps: 400
  weight_snapshot_interval_steps: 20000
  theta0: 0.0
  progress: true

learning_rule:
  # Intensive parameters are held fixed when N changes.  The enlarged bounds
  # cover the successful frozen-kernel scales but do not prescribe structure.
  # Restoring the 0.15 kHz release rate scale while retaining the former
  # intensive-kernel trajectories requires eta_release=eta_old/0.15^3.
  eta_hd_to_hd: 888.8888888888889
  eta_hr_to_hd: 5925.925925925926
  tau_delta: 0.10
  w_hd_to_hd_min: -200.0
  w_hd_to_hd_max: 466.6666666666667
  w_hr_to_hd_min: -533.3333333333334
  w_hr_to_hd_max: 533.3333333333334
  hd_to_hd_symmetry_mode: none
  hd_to_hd_balance_mode: none
  hr_to_hd_balance_mode: none
  zero_hd_to_hd_diagonal: false

visual:
  # Translation-equivalent clean teacher used by the frozen Phase-1 controls.
  profile: von_mises
  amplitude: 4.0
  kappa: 11.11111111111111
  baseline: 5.0
  normalize_peak: true
  light_excitation: 4.0
  proximal_scale: 1.0
  noise_std: 0.0
  noise_process: ou_additive
  noise_correlation_time: 0.065
  apply_noise_during_training: false
  apply_noise_during_visual_test: false
  noise_seed_offset: 20000
  # Inactive for von_mises, retained so this control differs from the
  # heterogeneous experiment only in the visual teacher family.
  heterogeneous_sigma: 1.4
  heterogeneous_beta: 2.6057585657926885
  heterogeneous_bias: 2.0814271322479385
  heterogeneous_n_angles: 512
  heterogeneous_seed_offset: 40000
  heterogeneous_alignment: center_of_mass
  heterogeneous_normalization: unit_angular_mean
  heterogeneous_population_sampling: nested_master
  heterogeneous_master_n_hd_cells: 480
  heterogeneous_plot_sample_count: 16
  heterogeneous_plot_seed_offset: 50000

velocity:
  process: ou
  mean: 0.0
  std: 3.9269908169872414
  tau: 0.50
  clip: 12.566370614359172
  k_vel: 0.15915494309189535

paths:
  runs_root: runs/vafidis_population_mean_von_mises
  reports_root: reports
