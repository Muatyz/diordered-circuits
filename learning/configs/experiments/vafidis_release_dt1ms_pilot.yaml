# Fast pilot for checking whether the release-parameter regime develops the
# expected learning trend before committing to the 80,000 s baseline. The
# legacy filename is retained, but Eq. (4) requires the release dt=0.5 ms.

experiment_name: vafidis_release_dt1ms_pilot

model:
  n_theta: 60
  n_hr: 60
  tau_s: 0.065
  tau_hd_to_hr: 0.065
  tau_l_hd: 0.01
  p_distal_to_proximal: 0.6666666666666666
  c_hd_proximal: 0.001
  g_l_hd_proximal: 1.0
  g_d_hd_to_proximal: 2.0
  b_hd: 1.0
  b_hr: 1.5
  hd_distal_normalization: raw_sum
  w_hd_to_hr_strength: 13.333333333333334
  activation:
    name: sigmoid
    gain: 2.5
    bias: 1.0
    max_rate: 0.15
  init:
    w_hd_to_hd_mode: random_normal
    w_hr_to_hd_mode: random_normal
    w_hd_to_hd_scale: 0.09128709291752768
    w_hr_to_hd_scale: 0.09128709291752768
    local_sigma: 0.45
    random_jitter: 0.0

simulation:
  seed: 42
  # Paper/release Euler step. A 10,000 s screening horizon preserves the old
  # pilot's 20 million updates while satisfying Eq. (4)'s stability bound.
  dt: 0.0005
  train_duration: 10000.0
  # One hundred approximately equally spaced training/weight records.
  save_interval_steps: 200000
  weight_snapshot_interval_steps: 200000
  theta0: 0.0
  progress: true
  plasticity_enabled: true
  random_stream_mode: component_split
  initialization_seed_offset: 0
  velocity_seed_offset: 10000
  early_stopping:
    enabled: false

learning_rule:
  eta_hd_to_hd: 50.0
  eta_hr_to_hd: 50.0
  tau_delta: 0.10
  w_hd_to_hd_min: null
  w_hd_to_hd_max: null
  w_hr_to_hd_min: null
  w_hr_to_hd_max: null
  hd_to_hd_symmetry_mode: none
  hd_to_hd_balance_mode: none
  hr_to_hd_balance_mode: none
  zero_hd_to_hd_diagonal: false

visual:
  profile: von_mises
  amplitude: 4.0
  kappa: 11.11111111111111
  baseline: 5.0
  normalize_peak: true
  light_excitation: 4.0
  proximal_scale: 1.0
  noise_std: 0.0
  noise_process: ou_additive
  noise_correlation_time: 0.065
  apply_noise_during_training: true
  apply_noise_during_visual_test: true
  noise_seed_offset: 20000

velocity:
  process: ou
  mean: 0.0
  std: 3.9269908169872414
  tau: 0.50
  clip: null
  k_vel: 0.15915494309189535

paths:
  runs_root: runs/vafidis_release_dt1ms_pilot
  reports_root: reports
