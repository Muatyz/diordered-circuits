# Larger HD population trained by a Clark-style heterogeneous visual teacher.
# This isolates the joint hypothesis in TODO 7.3 meeting notes, section 4:
# whether a more mammalian-scale population can learn a continuous attractor
# from heterogeneous, asymmetric and potentially multi-peaked cue profiles.
# Compare against vafidis_toy.yaml with the same seed and training protocol.

experiment_name: vafidis_mammalian_heterogeneous_n360

model:
  # Six times the baseline population (60 -> 360), while retaining the paired-HD
  # geometry and equal left/right HR wings required by this toy model.
  n_theta: 120
  n_hr: 120
  tau_s: 0.065
  tau_hd_to_hr: 0.04
  tau_l_hd: 0.01
  p_distal_to_proximal: 0.6666666667
  b_hd: 0.6
  b_hr: 1.5
  w_hd_to_hr_strength: 2.0
  activation:
    name: sigmoid
    gain: 2.5
    bias: 1.0
  init:
    w_hd_to_hd_mode: zeros
    w_hr_to_hd_mode: zeros
    w_hd_to_hd_scale: 0.03
    w_hr_to_hd_scale: 0.02
    local_sigma: 0.45
    random_jitter: 0.001

simulation:
  seed: 42
  dt: 0.01
  train_duration: 16000.0
  bump_test_duration: 10.0
  darkness_test_duration: 10.0
  cue_duration: 1
  pi_cue_duration: 4.0
  recue_duration: 8.0
  save_interval_steps: 20
  weight_snapshot_interval_steps: 1000
  theta0: 0.0
  progress: true

learning_rule:
  eta_hd_to_hd: 3.0
  eta_hr_to_hd: 20.0
  tau_delta: 0.10
  w_hd_to_hd_min: -1.5
  w_hd_to_hd_max: 2.0
  w_hr_to_hd_min: -1.5
  w_hr_to_hd_max: 1.5
  hd_to_hd_symmetry_mode: none
  hd_to_hd_balance_mode: none
  hr_to_hd_balance_mode: none

visual:
  profile: heterogeneous_gaussian_process
  # One shared gain multiplies every Clark unit-angular-mean profile. Its value
  # matches the angular-mean excitation of the peak-normalized Vafidis cue:
  # 4 * mean_theta[exp(kappa * (cos(theta) - 1))] = 0.484419041134548
  # for kappa=11.11111111111111. Thus total cue excitation is controlled while
  # neuron-to-neuron peak-height heterogeneity is retained.
  amplitude: 0.484419041134548
  # kappa is unused by this profile but retained so the resolved config remains
  # directly comparable with the von-Mises baseline.
  kappa: 11.11111111111111
  baseline: 5.0
  normalize_peak: true
  light_excitation: 4.0
  proximal_scale: 0.3333333333
  noise_std: 0.0
  noise_process: ou_additive
  noise_correlation_time: 0.065
  apply_noise_during_training: true
  apply_noise_during_visual_test: true
  noise_seed_offset: 20000

  # Best-fit parameters from reproduction/data processing output
  # data/processed/figure5_de_parameter_fit.json. Profiles are sampled once per
  # run, COM-aligned to the model HD preferences, and fixed throughout training.
  heterogeneous_sigma: 1.4
  heterogeneous_beta: 2.6057585657926885
  heterogeneous_bias: 2.0814271322479385
  heterogeneous_n_angles: 360
  heterogeneous_seed_offset: 40000
  heterogeneous_alignment: center_of_mass
  # Keep the original Clark normalized-softplus convention: every generated
  # curve has angular mean one, then all neurons receive the shared amplitude
  # above. This is independent of population size and preserves unequal peaks.
  heterogeneous_normalization: unit_angular_mean
  # Standard figure generation samples these many neurons with a run-stable
  # RNG seed and plots their effective proximal visual-current profiles.
  heterogeneous_plot_sample_count: 16
  heterogeneous_plot_seed_offset: 50000

velocity:
  process: ou
  mean: 0.0
  std: 3.9269908169872414
  tau: 0.50
  clip: 12.566370614359172
  k_vel: 0.15915494309189535

tests:
  # 75 deg/s stays inside the empirically observed near-unit-gain PI regime. The
  # separate 41-point gain scan still extends to +/-500 deg/s to expose failure.
  darkness_angular_velocity: 1.3089969389957472
  # Frozen-weight visual-cue sweep used to estimate each HD cell's empirical
  # tuning curve and COM preferred direction. The previous fixed 0.35 s sweep
  # retained large transients in this slow heterogeneous network. Each heading
  # now settles for at least 1.4 s and may continue to 6.0 s until the largest
  # HD-rate change over the trailing 0.2 s is at most 0.002.
  hd_tuning_curve_angles: 360
  hd_tuning_curve_settle_duration: 4
  hd_tuning_curve_max_settle_duration: 6.0
  hd_tuning_curve_convergence_window: 0.2
  hd_tuning_curve_convergence_tolerance: 0.002
  hd_tuning_curve_sample_count: 8
  # Independent OU PI trajectories; analysis uses PVA/COM decode only.
  ou_pi_ensemble_trials: 24
  ou_pi_ensemble_seed_offset: 60000
  ou_pi_ensemble_fit_start_time: 0.5
  bump_diffusion_duration: 10.0
  # Increased from 120 to reduce uncertainty in zero-velocity ensemble moments.
  bump_diffusion_trials: 300
  bump_diffusion_test_noise_std: 0.1
  bump_diffusion_seed_offset: 30000
  bump_diffusion_fit_start_time: 1.0
  bump_diffusion_fit_end_time: null
  # Frozen-weight attractor-landscape screening protocol. Uniform cue starts
  # are released into zero-velocity darkness and decoded by PVA, peak neuron,
  # and Clark Eq. 6 overlap. Use 360 starts / 60 s for a formal dense map.
  bump_attractor_trajectory_enabled: true
  bump_attractor_initial_conditions: 360
  bump_attractor_duration: 30.0
  bump_attractor_cue_duration: 4.0
  bump_attractor_sample_interval: 0.25
